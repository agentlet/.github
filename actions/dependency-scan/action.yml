name: Dependency vulnerability scan
description: >-
  Scans dependencies for known vulnerabilities and applies a blocking gate
  (critical/high with a fix, or any CISA KEV entry), with SARIF upload,
  reports, expiring exceptions and an optional tracking issue.
author: agentlet
branding:
  icon: shield
  color: red

inputs:
  blocking-sbom:
    description: >-
      Path, or newline/comma separated list of paths, to CycloneDX SBOM files
      whose components are the BLOCKING scope (what you ship). Several files
      are merged and deduplicated by purl. Required unless blocking-lockfile
      is true.
    required: false
    default: ''
  blocking-lockfile:
    description: >-
      When true the whole lockfile is the blocking scope (for repos where
      everything runs on the developer machine).
    required: false
    default: 'false'
  lockfile:
    description: >-
      Lockfile to scan. Reporting only (never blocks) unless blocking-lockfile
      is true. Empty string skips it.
    required: false
    default: package-lock.json
  exceptions-file:
    description: Expiring exceptions file. A missing file means no exceptions.
    required: false
    default: security/vulnerability-exceptions.json
  report-dir:
    description: >-
      Directory for the reports (SARIF, JSON, markdown summary, merged SBOM).
      Must be relative to the workspace.
    required: false
    default: reports/security
  min-severity:
    description: Minimum severity that can block (low, medium, high or critical).
    required: false
    default: high
  upload-sarif:
    description: >-
      Upload the SARIF to code scanning. Skipped automatically on fork pull
      requests and when no SARIF was produced. The caller job needs
      security-events write.
    required: false
    default: 'true'
  sarif-category:
    description: Code scanning category for the SARIF upload.
    required: false
    default: dependency-vulnerabilities
  artifact-name:
    description: >-
      Name of the uploaded reports artifact. Must be unique per workflow run,
      so set it when the action is used more than once.
    required: false
    default: dependency-scan-reports
  fail-on-gate:
    description: Fail the job when the gate fails.
    required: false
    default: 'true'
  issue-on-failure:
    description: >-
      When true and the gate fails, open or update ONE issue labelled security,
      deduplicated by issue-title. The caller job needs issues write.
    required: false
    default: 'false'
  issue-title:
    description: Title (and dedupe key) of the tracking issue.
    required: false
    default: 'Dependency scan: blocking vulnerability'
  osv-scanner-version:
    description: Pinned osv-scanner release to install (linux amd64 only).
    required: false
    default: '2.6.0'
  github-token:
    description: Token used by the optional issue step.
    required: false
    default: ${{ github.token }}

outputs:
  gate-outcome:
    description: pass or fail.
    value: ${{ steps.scan.outputs.gate-outcome }}
  blocking-count:
    description: Number of blocking findings (after exceptions).
    value: ${{ steps.scan.outputs.blocking-count }}
  report-path:
    description: Path of the JSON report.
    value: ${{ steps.scan.outputs.report-path }}
  sarif-path:
    description: Path of the SARIF file (empty when none was produced).
    value: ${{ steps.scan.outputs.sarif-path }}

runs:
  using: composite
  steps:
    - name: Check prerequisites
      shell: bash
      env:
        OSV_SCANNER_VERSION: ${{ inputs.osv-scanner-version }}
        BLOCKING_SBOM: ${{ inputs.blocking-sbom }}
        BLOCKING_LOCKFILE: ${{ inputs.blocking-lockfile }}
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS}" != "Linux" ] || [ "${RUNNER_ARCH}" != "X64" ]; then
          echo "::error::dependency-scan supports Linux x64 runners only (got ${RUNNER_OS} ${RUNNER_ARCH})."
          exit 1
        fi
        if ! command -v node >/dev/null 2>&1; then
          echo "::error::Node.js 20 or newer is required on PATH. Add actions/setup-node before this action (ubuntu-latest already has it)."
          exit 1
        fi
        node_major="$(node -p 'process.versions.node.split(".")[0]')"
        if [ "${node_major}" -lt 20 ]; then
          echo "::error::Node.js 20 or newer is required, found $(node --version). Add actions/setup-node before this action."
          exit 1
        fi
        if ! [[ "${OSV_SCANNER_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::osv-scanner-version must look like 2.6.0, got '${OSV_SCANNER_VERSION}'."
          exit 1
        fi
        if [ "${BLOCKING_LOCKFILE}" != "true" ] && [ -z "$(printf '%s' "${BLOCKING_SBOM}" | tr -d '[:space:],')" ]; then
          echo "::error::Set blocking-sbom, or set blocking-lockfile to true."
          exit 1
        fi

    - name: Install osv-scanner
      # Official release binary, pinned version, checksum-verified against
      # the release's own SHA256SUMS file. No curl piped to a shell.
      shell: bash
      env:
        OSV_SCANNER_VERSION: ${{ inputs.osv-scanner-version }}
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/osv-scanner"
        mkdir -p "${dir}"
        cd "${dir}"
        base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
        # Saved under its release name: that is what SHA256SUMS lists.
        curl -fsSL -o osv-scanner_linux_amd64 "${base}/osv-scanner_linux_amd64"
        curl -fsSL -o osv-scanner_SHA256SUMS "${base}/osv-scanner_SHA256SUMS"
        grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
        chmod +x osv-scanner_linux_amd64
        mkdir -p bin
        mv osv-scanner_linux_amd64 bin/osv-scanner
        echo "${dir}/bin" >> "${GITHUB_PATH}"
        "${dir}/bin/osv-scanner" --version

    - name: Run vulnerability scan and gate
      id: scan
      shell: bash
      env:
        BLOCKING_SBOM: ${{ inputs.blocking-sbom }}
        BLOCKING_LOCKFILE: ${{ inputs.blocking-lockfile }}
        LOCKFILE: ${{ inputs.lockfile }}
        EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
        REPORT_DIR: ${{ inputs.report-dir }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
      run: |
        set -euo pipefail
        # --exit-zero: a failing gate is reported through the gate-outcome
        # output so the later steps (SARIF, artifact, issue) always run; the
        # last step of this action turns it into a failure.
        node "${{ github.action_path }}/bin/scan.mjs" \
          "--blocking-sbom=${BLOCKING_SBOM}" \
          "--blocking-lockfile=${BLOCKING_LOCKFILE}" \
          "--lockfile=${LOCKFILE}" \
          "--exceptions=${EXCEPTIONS_FILE}" \
          "--out-dir=${REPORT_DIR}" \
          "--min-severity=${MIN_SEVERITY}" \
          --exit-zero

    - name: Upload SARIF to code scanning
      # Skipped for pull requests from forks (read-only token) and when the
      # scan produced no SARIF, so the real error stays the visible one.
      if: >-
        always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-path != ''
        && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-path }}
        category: ${{ inputs.sarif-category }}

    - name: Upload scan reports
      if: always() && steps.scan.outputs.report-path != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-dir }}
        retention-days: 30
        if-no-files-found: ignore

    - name: Open or update a tracking issue
      if: always() && inputs.issue-on-failure == 'true' && steps.scan.outputs.gate-outcome == 'fail'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_TITLE: ${{ inputs.issue-title }}
        SUMMARY_FILE: ${{ inputs.report-dir }}/scan-summary.md
      run: |
        set -euo pipefail
        if [ -z "${ISSUE_TITLE}" ]; then
          echo "::error::issue-title must not be empty when issue-on-failure is true."
          exit 1
        fi
        gh label create security --color b60205 --description "Security related issues" --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
        search="\"${ISSUE_TITLE//\"/}\" in:title"
        existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --label security --state open --limit 100 \
          --search "${search}" --json number,title \
          --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty' || true)"
        if [ -n "${existing}" ]; then
          gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body-file "${SUMMARY_FILE}"
        else
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${ISSUE_TITLE}" --label security --body-file "${SUMMARY_FILE}"
        fi

    - name: Fail the job if the gate failed
      if: always() && inputs.fail-on-gate == 'true' && steps.scan.outputs.gate-outcome == 'fail'
      shell: bash
      run: |
        echo "::error::Dependency vulnerability gate failed. See the job summary and the uploaded reports."
        exit 1
